name: mobiarmy_flutter
description: Flutter and Flame migration foundation for MobiArmy2.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  collection: ^1.19.1
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/manifests/
    - assets/sprites/
    - assets/maps/
    - assets/audio/
    - assets/fonts/
